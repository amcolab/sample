<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>プロフィール登録 | MooM カメラマン</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; border-radius: 0 !important; }
    body { font-family: 'Noto Sans JP', sans-serif; background: #f3f4f6; color: #000; font-size: 13px; margin: 0; }

    /* ── Step bar ── */
    .step-bar { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 36px; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 110px; }
    .step-circle { width: 28px; height: 28px; border: 2px solid #ccc; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #999; }
    .step-circle.done { background: #000; border-color: #000; color: #fff; }
    .step-circle.active { border: 2px solid #000; background: #fff; color: #000; }
    .step-label { font-size: 10px; color: #999; white-space: nowrap; }
    .step-label.done { color: #000; }
    .step-label.active { color: #000; font-weight: 700; }
    .step-line { flex: 1; height: 2px; background: #ccc; max-width: 60px; margin-bottom: 22px; }
    .step-line.done { background: #000; }

    /* ── Form ── */
    .form-wrap { background: #fff; border: 1px solid #000; padding: 36px 40px; max-width: 660px; width: 100%; margin: 0 auto; }
    .section-header { font-size: 13px; font-weight: 700; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 20px; margin-top: 28px; }
    .section-header:first-of-type { margin-top: 0; }
    .field-row { display: grid; gap: 20px; margin-bottom: 16px; }
    .field-row.col2 { grid-template-columns: 1fr 1fr; }
    .field-row.col3 { grid-template-columns: 1fr 1fr 1fr; }
    .field-row.col1 { grid-template-columns: 1fr; }
    .field label { display: block; font-size: 11px; font-weight: 700; color: #555; margin-bottom: 5px; }
    .field label .req { color: #dc2626; margin-left: 3px; }
    .field label .opt { color: #999; font-weight: 400; margin-left: 3px; font-size: 10px; }
    .field input, .field select, .field textarea {
      width: 100%; border: 1px solid #000; padding: 8px 10px; font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif; outline: none; background: #fff;
    }
    .field input:focus, .field select:focus, .field textarea:focus { background: #fafafa; }
    .field input[readonly] { background: #f5f5f5; color: #888; cursor: not-allowed; }
    .field textarea { resize: vertical; min-height: 80px; }
    .field .hint { font-size: 10px; color: #999; margin-top: 4px; }
    .radio-group { display: flex; gap: 16px; padding: 6px 0; flex-wrap: wrap; }
    .radio-item { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
    .radio-item input[type=radio] { width: 14px; height: 14px; accent-color: #000; cursor: pointer; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; padding: 4px 0; }
    .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; border: 1px solid #ccc; padding: 5px 10px; background: #fff; }
    .checkbox-item:hover { border-color: #000; }
    .checkbox-item input[type=checkbox] { accent-color: #000; }

    /* ── Avatar upload ── */
    .avatar-upload { border: 1px dashed #000; width: 100px; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; background: #fafafa; font-size: 10px; color: #888; overflow: hidden; }
    .avatar-upload:hover { background: #f0f0f0; }

    /* ── Submit area ── */
    .submit-area { margin-top: 32px; border-top: 1px solid #e5e7eb; padding-top: 24px; display: flex; justify-content: flex-end; gap: 12px; }
    .btn { border: 1px solid #000; padding: 10px 24px; background: #fff; font-size: 13px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; font-weight: 600; }
    .btn:hover { background: #f2f2f2; }
    .btn-black { background: #000; color: #fff; border: 1px solid #000; padding: 10px 32px; font-size: 13px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; }
    .btn-black:hover { background: #333; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 24px; right: 24px; border: 1px solid #000; background: #fff; padding: 12px 20px; font-size: 13px; z-index: 9999; display: none; align-items: center; gap: 10px; min-width: 240px; }
    .toast.show { display: flex; }
  </style>
</head>
<body>

  <div style="min-height:100vh; padding: 40px 16px;">

    <!-- Logo -->
    <div style="text-align:center; margin-bottom:28px;">
      <div style="font-size:20px; font-weight:700; letter-spacing:1px;">MooM</div>
      <div style="font-size:11px; color:#888; margin-top:3px;">カメラマンパートナー登録</div>
    </div>

    <!-- Step bar -->
    <div class="step-bar">
      <div class="step">
        <div class="step-circle done"><i class="fas fa-check" style="font-size:10px;"></i></div>
        <div class="step-label done">招待確認</div>
      </div>
      <div class="step-line done"></div>
      <div class="step">
        <div class="step-circle done"><i class="fas fa-check" style="font-size:10px;"></i></div>
        <div class="step-label done">パスワード設定</div>
      </div>
      <div class="step-line done"></div>
      <div class="step">
        <div class="step-circle active">3</div>
        <div class="step-label active">プロフィール登録</div>
      </div>
      <div class="step-line"></div>
      <div class="step">
        <div class="step-circle">4</div>
        <div class="step-label">本人確認</div>
      </div>
      <div class="step-line"></div>
      <div class="step">
        <div class="step-circle">5</div>
        <div class="step-label">口座情報登録</div>
      </div>
      <div class="step-line"></div>
      <div class="step">
        <div class="step-circle">6</div>
        <div class="step-label">審査・完了</div>
      </div>
    </div>

    <!-- Form card -->
    <div class="form-wrap">
      <div style="margin-bottom:24px;">
        <h1 style="font-size:18px; font-weight:700; margin:0 0 6px 0;">基本情報の登録</h1>
        <p style="font-size:12px; color:#666; margin:0;">カメラマンとして活動するための基本情報を入力してください。入力内容はMooM運営が審査に使用します。</p>
      </div>

      <form id="profileForm" onsubmit="handleSubmit(event)">

        <!-- §1 個人情報 -->
        <div class="section-header">個人情報</div>

        <!-- プロフィール写真 + 氏名 -->
        <div style="display:flex; gap:24px; align-items:flex-start; margin-bottom:16px;">
          <div>
            <div style="font-size:11px; font-weight:700; color:#555; margin-bottom:6px;">
              プロフィール写真<span style="color:#999; font-size:10px; font-weight:400; margin-left:3px;">任意</span>
            </div>
            <div class="avatar-upload" id="avatarBox" onclick="document.getElementById('avatarInput').click()">
              <i class="fas fa-camera" style="font-size:20px; color:#bbb;"></i>
              <span>写真を追加</span>
            </div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="previewAvatar(event)">
          </div>
          <div style="flex:1; display:flex; flex-direction:column; gap:14px;">
            <div class="field-row col2">
              <div class="field">
                <label>姓<span class="req">*</span></label>
                <input type="text" placeholder="山田" required/>
              </div>
              <div class="field">
                <label>名<span class="req">*</span></label>
                <input type="text" placeholder="太郎" required/>
              </div>
            </div>
            <div class="field-row col2">
              <div class="field">
                <label>姓（フリガナ）<span class="req">*</span></label>
                <input type="text" placeholder="ヤマダ" required/>
              </div>
              <div class="field">
                <label>名（フリガナ）<span class="req">*</span></label>
                <input type="text" placeholder="タロウ" required/>
              </div>
            </div>
          </div>
        </div>

        <div class="field-row col2">
          <div class="field">
            <label>生年月日<span class="req">*</span></label>
            <input type="date" required/>
          </div>
          <div class="field">
            <label>性別<span class="req">*</span></label>
            <div class="radio-group" style="margin-top:2px;">
              <label class="radio-item"><input type="radio" name="gender" value="male" required/> 男性</label>
              <label class="radio-item"><input type="radio" name="gender" value="female"/> 女性</label>
              <label class="radio-item"><input type="radio" name="gender" value="other"/> その他</label>
            </div>
          </div>
        </div>

        <div class="field-row col2">
          <div class="field">
            <label>メールアドレス<span class="req">*</span></label>
            <input type="email" value="example@domain.com" readonly/>
            <div class="hint">招待メールアドレスは変更できません</div>
          </div>
          <div class="field">
            <label>電話番号<span class="req">*</span></label>
            <input type="tel" placeholder="090-0000-0000" required/>
          </div>
        </div>

        <!-- §2 住所 -->
        <div class="section-header">住所</div>

        <div class="field-row col2">
          <div class="field">
            <label>郵便番号<span class="req">*</span></label>
            <input type="text" placeholder="000-0000" maxlength="8" required/>
          </div>
          <div class="field" style="display:flex; align-items:flex-end;">
            <button type="button" class="btn" style="font-weight:400; font-size:12px; padding:8px 16px;">住所を自動入力</button>
          </div>
        </div>

        <div class="field-row col3">
          <div class="field">
            <label>都道府県<span class="req">*</span></label>
            <select required>
              <option value="">選択</option>
              <option>東京都</option><option>神奈川県</option><option>埼玉県</option>
              <option>千葉県</option><option>大阪府</option><option>愛知県</option>
              <option>福岡県</option><option>北海道</option><option>その他</option>
            </select>
          </div>
          <div class="field">
            <label>市区町村<span class="req">*</span></label>
            <input type="text" placeholder="渋谷区" required/>
          </div>
          <div class="field">
            <label>番地<span class="req">*</span></label>
            <input type="text" placeholder="神南1-2-3" required/>
          </div>
        </div>

        <div class="field-row col1">
          <div class="field">
            <label>建物名・部屋番号<span class="opt">任意</span></label>
            <input type="text" placeholder="〇〇マンション 101号室"/>
          </div>
        </div>

        <!-- §3 撮影・機材情報 -->
        <div class="section-header">撮影・機材情報</div>

        <div class="field-row col2">
          <div class="field">
            <label>撮影経験年数<span class="req">*</span></label>
            <select required>
              <option value="">選択してください</option>
              <option>1年未満</option>
              <option>1〜3年</option>
              <option>3〜5年</option>
              <option>5〜10年</option>
              <option>10年以上</option>
            </select>
          </div>
          <div class="field">
            <label>主な撮影ジャンル<span class="opt">任意</span></label>
            <select>
              <option value="">選択してください</option>
              <option>不動産・建築</option>
              <option>ポートレート</option>
              <option>商品・物撮り</option>
              <option>イベント</option>
              <option>その他</option>
            </select>
          </div>
        </div>

        <div class="field-row col1">
          <div class="field">
            <label>使用カメラ機材<span class="req">*</span></label>
            <input type="text" placeholder="例：Sony α7IV, Canon EOS R5" required/>
            <div class="hint">主に使用するカメラ機種を入力してください</div>
          </div>
        </div>

        <div class="field-row col1">
          <div class="field">
            <label>動画撮影・編集スキル<span class="req">*</span></label>
            <div class="radio-group">
              <label class="radio-item"><input type="radio" name="videoSkill" value="none" required/> なし</label>
              <label class="radio-item"><input type="radio" name="videoSkill" value="basic"/> 基礎レベル</label>
              <label class="radio-item"><input type="radio" name="videoSkill" value="intermediate"/> 中級レベル</label>
              <label class="radio-item"><input type="radio" name="videoSkill" value="advanced"/> 上級レベル</label>
            </div>
          </div>
        </div>

        <!-- §4 対応エリア -->
        <div class="section-header">対応エリア</div>

        <div class="field-row col1">
          <div class="field">
            <label>対応可能エリア<span class="req">*</span>（複数選択可）</label>
            <div class="checkbox-group">
              <label class="checkbox-item"><input type="checkbox"/> 東京都</label>
              <label class="checkbox-item"><input type="checkbox"/> 神奈川県</label>
              <label class="checkbox-item"><input type="checkbox"/> 埼玉県</label>
              <label class="checkbox-item"><input type="checkbox"/> 千葉県</label>
              <label class="checkbox-item"><input type="checkbox"/> 大阪府</label>
              <label class="checkbox-item"><input type="checkbox"/> 愛知県</label>
              <label class="checkbox-item"><input type="checkbox"/> 福岡県</label>
              <label class="checkbox-item"><input type="checkbox"/> その他</label>
            </div>
            <div class="hint">撮影対応できる都道府県を選択してください</div>
          </div>
        </div>

        <!-- §5 自己紹介 -->
        <div class="section-header">自己紹介</div>

        <div class="field-row col1">
          <div class="field">
            <label>自己PR・経歴<span class="opt">任意</span></label>
            <textarea placeholder="これまでの撮影経験や強みをご記入ください。例：不動産撮影の実績〇〇件、VR撮影対応可能など"></textarea>
            <div class="hint">最大500文字</div>
          </div>
        </div>

        <!-- Submit -->
        <div class="submit-area">
          <button type="button" class="btn" onclick="history.back()">戻る</button>
          <button type="submit" class="btn-black">次へ：本人確認　→</button>
        </div>

      </form>
    </div>

    <div style="text-align:center; margin-top:20px; font-size:11px; color:#aaa; padding-bottom:40px;">
      入力内容はMooM運営が確認後、審査結果をメールでご連絡します
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle" style="color:#16a34a;"></i>
    <span id="toastMsg"></span>
  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      location.href = 'CM1-02.html';
    }

    function previewAvatar(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const box = document.getElementById('avatarBox');
        box.innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
      };
      reader.readAsDataURL(file);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }
  </script>
</body>
</html>
