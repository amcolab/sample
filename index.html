<!DOCTYPE html>

<html lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>招待リンク確認 | MooM</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Noto Sans JP -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="typography">
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
  </style>
<style data-purpose="wireframe-styling">
    /* Grayscale enforcement for wireframe aesthetic */
    .wireframe-border {
      border: 2px solid #333333;
    }
    .wireframe-bg-light {
      background-color: #f3f4f6;
    }
    .wireframe-bg-header {
      background-color: #e5e7eb;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<!-- BEGIN: InviteConfirmationCard -->
<main class="w-full max-w-md bg-white wireframe-border p-8" data-purpose="centered-auth-card">
<!-- BEGIN: Header -->
<header class="text-center mb-8">
<h1 class="text-2xl font-bold text-black mb-2">招待リンク確認</h1>
<p class="text-sm font-medium text-gray-700">MooMパートナーアカウントへの招待です</p>
<p class="text-xs text-gray-500 mt-2">招待内容をご確認のうえ、アカウント設定を開始してください</p>
</header>
<!-- END: Header -->
<!-- BEGIN: InviteSummaryBlock -->
<section class="wireframe-bg-light border border-gray-300 p-4 mb-8" data-purpose="summary-details">
<dl class="space-y-4">
<div class="flex flex-col border-b border-gray-300 pb-2">
<dt class="text-xs text-gray-600 font-bold uppercase">招待先メールアドレス</dt>
<dd class="text-sm text-black">example@domain.com</dd>
</div>
<div class="flex flex-col border-b border-gray-300 pb-2">
<dt class="text-xs text-gray-600 font-bold uppercase">招待ロール</dt>
<dd class="text-sm text-black">カメラマン</dd>
</div>
<div class="flex flex-col border-b border-gray-300 pb-2">
<dt class="text-xs text-gray-600 font-bold uppercase">招待元</dt>
<dd class="text-sm text-black">MooM運営事務局</dd>
</div>
<div class="flex flex-col">
<dt class="text-xs text-gray-600 font-bold uppercase">招待有効期限</dt>
<dd class="text-sm text-black">YYYY/MM/DD HH:MM</dd>
</div>
</dl>
</section>
<!-- END: InviteSummaryBlock -->
<!-- BEGIN: CTAArea -->
<div class="flex flex-col space-y-4 mb-8" data-purpose="action-buttons">
<!-- Primary Action -->
<button class="w-full bg-black text-white py-3 px-4 font-bold hover:bg-gray-800 transition-colors" type="button" onclick="location.href='AP1-09.html'">
        アカウント設定を開始
      </button>
<!-- Secondary Action -->
<div class="text-center">
<a class="text-sm text-gray-600 underline hover:text-black" href="AP0-01.html">
          ログイン画面へ
        </a>
</div>
</div>
<!-- END: CTAArea -->
<!-- BEGIN: FooterNote -->
<footer class="border-t border-gray-200 pt-4">
<ul class="text-[11px] text-gray-500 list-disc list-inside space-y-1">
<li>この招待リンクは一度のみ利用できる場合があります</li>
<li>招待内容に誤りがある場合は、招待元へご確認ください</li>
</ul>
</footer>
<!-- END: FooterNote -->
</main>
<!-- END: InviteConfirmationCard -->
</body></html>
