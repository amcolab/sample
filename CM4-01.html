        * { font-family: 'Noto Sans JP', sans-serif; border-radius: 0 !important; }

        .nav-active { font-weight:700; border-left:4px solid #000; background:#f9f9f9; padding:10px 20px; display:block; font-size:13px; color:#000; text-decoration:none; }

        /* Dropdown */
        .dropdown-wrap { position:relative; }
        .dropdown-menu { display:none; position:absolute; right:0; top:calc(100% + 4px); background:#fff; border:1px solid #000; min-width:160px; z-index:50; }
        .dropdown-item { display:block; padding:8px 14px; font-size:12px; cursor:pointer; color:#333; text-decoration:none; }
        .dropdown-item:hover { background:#f5f5f5; }

        /* Calendar table */
        .cal-table { width:100%; border-collapse:collapse; table-layout:fixed; }
        .cal-table th { border:1px solid #ddd; background:#f2f2f2; font-size:12px; font-weight:700; padding:8px 6px; text-align:center; }
        .cal-table td { border:1px solid #ddd; vertical-align:top; padding:4px 5px; height:96px; width:calc(100%/7); }

        .cal-table td.today-cell { background:#f0f4ff; }
        .cal-date { text-align:right; font-size:12px; color:#333; margin-bottom:3px; }
        .cal-date.today { font-weight:700; color:#1a202c; }
        .cal-date.sat { color:#1a6eb5; }
        .cal-date.sun { color:#b52020; }
        .cal-date.other { color:#ccc; }

        .ev-bar.ev-done { background:#f0f0f0; color:#aaa; text-decoration:line-through; }
        .ev-bar.ev-active { background:#fff; color:#000; border-color:#888; cursor:pointer; }
        .ev-bar.ev-active:hover { background:#f5f5f5; }

        /* Event blocks */
        .ev-active {
            background: #1a202c;
            color: #fff;
            padding: 5px 7px;
            font-size: 10px;
            cursor: pointer;
            display: block;
            line-height: 1.4;
        }
        .ev-active:hover { background: #2d3748; }
        .ev-done {
            background: #ececec;
            color: #b0b0b0;
            padding: 5px 7px;
            font-size: 10px;
            cursor: pointer;
            display: block;
            line-height: 1.4;
        }

        /* Settings drawer */
        #settingsOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 200;
        }
        #settingsPanel {
            position: absolute;
            top: 0; right: 0;
            width: 380px;
            height: 100%;
            background: #fff;
            border-left: 1px solid #000;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* Toggle switch */
        .switch { position:relative; display:inline-block; width:40px; height:20px; }
        .switch input { opacity:0; width:0; height:0; }
        .slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#ccc; transition:.3s; border:1px solid #000; }
        .slider:before { position:absolute; content:""; height:14px; width:14px; left:2px; bottom:2px; background:#fff; transition:.3s; border:1px solid #000; }
        input:checked + .slider { background:#000; }
        input:checked + .slider:before { transform:translateX(20px); }

        /* Upcoming table */

        /* Slot row avail indicator */
        .slot-avail { background:#f9f9f9; }

        /* Event detail popup */
        #evPopupOverlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 600;

        .pop-row {

        }
        .pop-row:last-child { border-bottom: none; }
        .pop-key {
            width: 230px; flex-shrink: 0; display: flex; align-items: center; gap: 8px;

        .pop-val {
            flex: 1; padding: 10px 14px; font-size: 13px; display: flex; align-items: center;
            line-height: 1.6;

<script>
/* ===== HEADER DROPDOWNS ===== */
function toggleBell() {
    var bell = document.getElementById('bellDrop');
    var user = document.getElementById('userMenuDrop');
    var isOpen = bell.style.display === 'block';
    user.style.display = 'none';
    bell.style.display = isOpen ? 'none' : 'block';
}
function toggleUserMenu() {
    var user = document.getElementById('userMenuDrop');
    var bell = document.getElementById('bellDrop');
    var isOpen = user.style.display === 'block';
    bell.style.display = 'none';
    user.style.display = isOpen ? 'none' : 'block';
}
document.addEventListener('click', function(e) {
    var bellWrap = document.getElementById('bellWrap');
    if (bellWrap && !bellWrap.contains(e.target))
        document.getElementById('bellDrop').style.display = 'none';
    var userWrap = document.getElementById('userMenuWrap');
    if (userWrap && !userWrap.contains(e.target))
        document.getElementById('userMenuDrop').style.display = 'none';
});

/* ===== SETTINGS DRAWER ===== */
function openSettings() {
    document.getElementById('settingsOverlay').style.display = 'block';
    renderAvailSettings();
}
function closeSettings() {
    document.getElementById('settingsOverlay').style.display = 'none';
}
function handleOverlayClick(e) {
    if (e.target === document.getElementById('settingsOverlay')) closeSettings();
}

/* ===== AVAILABILITY SETTINGS ===== */
var DAYS = ['月曜日','火曜日','水曜日','木曜日','金曜日','土曜日','日曜日'];
var SLOTS_LABEL = ['午前 09-12','昼 12-14','午後 14-17','夕方 17-20'];
var availData = {
    '月曜日': [true,  true,  false, false],
    '火曜日': [true,  false, true,  false],
    '水曜日': [true,  true,  true,  false],
    '木曜日': [true,  false, false, false],
    '金曜日': [true,  true,  false, true],
    '土曜日': [false, false, false, false],
    '日曜日': [false, false, false, false],
};

function renderAvailSettings() {
    var container = document.getElementById('availSettings');
    container.innerHTML = '';
    DAYS.forEach(function(day) {
        var dayDiv = document.createElement('div');
        dayDiv.style.cssText = 'border:1px solid #000; padding:8px;';

        var header = document.createElement('div');
        header.style.cssText = 'font-size:11px; font-weight:700; margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid #eee;';
        header.textContent = day;
        dayDiv.appendChild(header);

        var grid = document.createElement('div');
        grid.style.cssText = 'display:grid; grid-template-columns:1fr 1fr; gap:4px;';
        SLOTS_LABEL.forEach(function(sl, i) {
            var label = document.createElement('label');
            label.style.cssText = 'border:1px solid #ccc; padding:4px 6px; display:flex; align-items:center; gap:4px; font-size:10px; cursor:pointer;';
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = availData[day][i];
            cb.style.cssText = 'margin:0; cursor:pointer;';
            label.appendChild(cb);
            label.appendChild(document.createTextNode(sl));
            grid.appendChild(label);
        });
        dayDiv.appendChild(grid);
        container.appendChild(dayDiv);
    });
}

/* ===== MONTHLY CALENDAR RENDER ===== */
var currentMonth = null;

function formatDate(d) {
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + mm + '-' + dd;
}

function renderCalendar() {
    var year  = currentMonth.getFullYear();
    var month = currentMonth.getMonth();
    var todayStr = formatDate(new Date());

    document.getElementById('calTitle').textContent = year + '年' + (month + 1) + '月';

    var table = document.getElementById('calTable');
    table.innerHTML = '';

    // ── THEAD ──
    var thead = document.createElement('thead');
    var htr   = document.createElement('tr');
    var dayColors = ['','','','','','color:#1a6eb5;','color:#b52020;'];
    WEEK_DAYS_JP.forEach(function(day, i) {
        var th = document.createElement('th');
        th.style.cssText = dayColors[i];
        th.textContent = day;
        htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    // ── TBODY ──
    var tbody = document.createElement('tbody');

    // First day of month: what weekday (Mon=0 … Sun=6)
    var firstDay  = new Date(year, month, 1);
    var fdow      = firstDay.getDay(); // 0=Sun
    var startOffset = (fdow === 0) ? 6 : fdow - 1; // convert to Mon-first

    // Iterate 6 rows max
    for (var row = 0; row < 6; row++) {
        var tr = document.createElement('tr');
        var anyInMonth = false;

        for (var col = 0; col < 7; col++) {
            var dayNum   = 1 - startOffset + row * 7 + col;
            var cellDate = new Date(year, month, dayNum);
            var cellStr  = formatDate(cellDate);
            var inMonth  = cellDate.getMonth() === month;
            var isToday  = cellStr === todayStr;
            var isSat    = col === 5, isSun = col === 6;

            if (inMonth) anyInMonth = true;

            var td = document.createElement('td');
            if (!inMonth)  td.classList.add('other-month');
            if (isToday)   td.classList.add('today-cell');

            // Date number
            var dateDiv = document.createElement('div');
            dateDiv.className = 'cal-date'
                + (isToday  ? ' today' : '')
                + (isSat && inMonth ? ' sat' : '')
                + (isSun && inMonth ? ' sun' : '')
                + (!inMonth ? ' other' : '');
            dateDiv.textContent = cellDate.getDate() + '日';
            td.appendChild(dateDiv);

            // Events for this day
            var dayEvs = EVENTS.filter(function(e) { return e.date === cellStr; });
            dayEvs.sort(function(a, b) { return a.startHour - b.startHour; });
            dayEvs.forEach(function(ev) {
                var bar = document.createElement('div');
                bar.className = 'ev-bar ' + (ev.done ? 'ev-done' : 'ev-active');
                bar.textContent = hh(ev.startHour) + ' ' + ev.title;
                if (!ev.done) {
                    (function(evRef) {
                        bar.onclick = function() { openEvPopup(evRef); };
                    })(ev);
                }
                td.appendChild(bar);
            });

            tr.appendChild(td);
        }

        // Skip row if it's entirely outside current month (last row check)
        if (row >= 4 && !anyInMonth) break;
        tbody.appendChild(tr);
    }

    table.appendChild(tbody);
}

function prevMonth() {
    currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
    renderCalendar();
}
function nextMonth() {
    currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);
    renderCalendar();
}
function goToday() {
    var t = new Date();
    currentMonth = new Date(t.getFullYear(), t.getMonth(), 1);
    renderCalendar();
}

/* ===== INIT ===== */
var t0 = new Date();
currentMonth = new Date(t0.getFullYear(), t0.getMonth(), 1);
renderCalendar();

/* ===== EVENT POPUP ===== */
function openEvPopup(ev) {
    var d = new Date(ev.date);
    var label = (d.getMonth()+1) + '月' + d.getDate() + '日 ' + hh(ev.startHour) + ' — ' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + hh(ev.endHour);
    var rows = [
        ['📅', '予約日時',               label],
        ['👤', '担当者',                 ev.担当者 || '—'],
        ['¥',  '家賃',                   ev.家賃 || '—'],
        ['📍', '所在地',                 ev.所在地 || '—'],
        ['📋', '広告費',                 ev.広告費 || '—'],
        ['👥', '取引態様',               ev.取引態様 || '—'],
        ['👁', '内見方法（鍵取・現地 等）', ev.内見方法 || ''],
        ['🔐', '内見方法詳細（鍵情報等）', ev.内見方法詳細 || ''],
        ['⚠',  '内見時注意事項',         ev.内見時注意事項 || ''],
    ];
    var html = rows.map(function(r) {
        return '<div class="pop-row">'
            + '<div class="pop-key"><span class="picon">' + r[0] + '</span>' + r[1] + '</div>'
            + '<div class="pop-val">' + r[2] + '</div>'
            + '</div>';
    }).join('');
    document.getElementById('evPopupBody').innerHTML = html;
    document.getElementById('evPopupOverlay').classList.add('open');
}
function closeEvPopup() {
    document.getElementById('evPopupOverlay').classList.remove('open');
}
</script>

    <div id="evPopup">

        </div>
        <div id="evPopupBody"></div>
    </div>
</div>
