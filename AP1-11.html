<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>口座情報登録 | MooM カメラマン</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; border-radius: 0 !important; }
    body { font-family: 'Noto Sans JP', sans-serif; background: #f3f4f6; color: #000; font-size: 13px; margin: 0; }

    /* ── Step bar ── */
    .step-bar { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 36px; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 100px; }
    .step-circle { width: 28px; height: 28px; border: 2px solid #ccc; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #999; }
    .step-circle.done { background: #000; border-color: #000; color: #fff; }
    .step-circle.active { border: 2px solid #000; background: #fff; color: #000; }
    .step-label { font-size: 10px; color: #999; white-space: nowrap; }
    .step-label.done { color: #000; }
    .step-label.active { color: #000; font-weight: 700; }
    .step-line { flex: 1; height: 2px; background: #ccc; max-width: 50px; margin-bottom: 22px; }
    .step-line.done { background: #000; }

    /* ── Form wrap ── */
    .form-wrap { background: #fff; border: 1px solid #000; padding: 36px 40px; max-width: 660px; width: 100%; margin: 0 auto; }
    .section-header { font-size: 13px; font-weight: 700; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 20px; margin-top: 28px; }
    .section-header:first-of-type { margin-top: 0; }

    /* ── Form ── */
    .field label { display: block; font-size: 11px; font-weight: 700; color: #555; margin-bottom: 5px; }
    .field label .req { color: #dc2626; margin-left: 3px; }
    .field input, .field select {
      width: 100%; border: 1px solid #000; padding: 8px 10px; font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif; outline: none; background: #fff;
    }
    .field input:focus, .field select:focus { background: #fafafa; }
    .radio-group { display: flex; gap: 16px; padding: 6px 0; }
    .radio-item { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
    .radio-item input[type=radio] { accent-color: #000; }

    /* ── Submit area ── */
    .submit-area { margin-top: 32px; border-top: 1px solid #e5e7eb; padding-top: 24px; display: flex; justify-content: flex-end; gap: 12px; }
    .btn { border: 1px solid #000; padding: 10px 24px; background: #fff; font-size: 13px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; font-weight: 600; }
    .btn:hover { background: #f2f2f2; }
    .btn-black { background: #000; color: #fff; border: 1px solid #000; padding: 10px 32px; font-size: 13px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; }
    .btn-black:hover { background: #333; }

    /* ── Notice box ── */
    .notice-box { border: 1px solid #000; background: #f9f9f9; padding: 14px 16px; margin-bottom: 20px; font-size: 12px; line-height: 1.8; }
  </style>
</head>
<body>
<div style="min-height:100vh; padding:40px 16px;">

  <!-- Logo -->
  <div style="text-align:center; margin-bottom:28px;">
    <div style="font-size:20px; font-weight:700; letter-spacing:1px;">MooM</div>
    <div style="font-size:11px; color:#888; margin-top:3px;">カメラマンパートナー登録</div>
  </div>

  <!-- Step bar -->
  <div class="step-bar">
    <div class="step">
      <div class="step-circle done"><i class="fas fa-check" style="font-size:10px;"></i></div>
      <div class="step-label done">招待確認</div>
    </div>
    <div class="step-line done"></div>
    <div class="step">
      <div class="step-circle done"><i class="fas fa-check" style="font-size:10px;"></i></div>
      <div class="step-label done">パスワード設定</div>
    </div>
    <div class="step-line done"></div>
    <div class="step">
      <div class="step-circle done"><i class="fas fa-check" style="font-size:10px;"></i></div>
      <div class="step-label done">プロフィール登録</div>
    </div>
    <div class="step-line done"></div>
    <div class="step">
      <div class="step-circle done"><i class="fas fa-check" style="font-size:10px;"></i></div>
      <div class="step-label done">本人確認</div>
    </div>
    <div class="step-line done"></div>
    <div class="step">
      <div class="step-circle active">5</div>
      <div class="step-label active">口座情報登録</div>
    </div>
    <div class="step-line"></div>
    <div class="step">
      <div class="step-circle">6</div>
      <div class="step-label">審査・完了</div>
    </div>
  </div>

  <!-- Form card -->
  <div class="form-wrap">
    <div style="margin-bottom:24px;">
      <h1 style="font-size:18px; font-weight:700; margin:0 0 6px 0;">振込先口座情報の登録</h1>
      <p style="font-size:12px; color:#666; margin:0;">報酬をお支払いするための振込先口座をご登録ください。</p>
    </div>

    <form id="bankForm" onsubmit="handleSubmit(event)">

      <div class="notice-box">
        <i class="fas fa-info-circle" style="margin-right:6px;"></i> ご本人様名義の口座をご登録ください。
      </div>

      <div class="section-header">銀行口座情報</div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:16px;">
        <div class="field">
          <label>銀行名<span class="req">*</span></label>
          <input type="text" placeholder="例：三菱UFJ銀行" required/>
        </div>
        <div class="field">
          <label>支店名<span class="req">*</span></label>
          <input type="text" placeholder="例：渋谷支店" required/>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:16px;">
        <div class="field">
          <label>口座種別<span class="req">*</span></label>
          <div class="radio-group">
            <label class="radio-item"><input type="radio" name="accountType" value="1" checked required/> 普通</label>
            <label class="radio-item"><input type="radio" name="accountType" value="2"/> 当座</label>
          </div>
        </div>
        <div class="field">
          <label>口座番号<span class="req">*</span></label>
          <input type="text" placeholder="7桁の数字" maxlength="7" pattern="\d{7}" required/>
        </div>
      </div>

      <div class="field" style="margin-bottom:16px;">
        <label>口座名義（カナ）<span class="req">*</span></label>
        <input type="text" placeholder="例：サトウ ケンタ" required/>
        <p style="font-size:10px; color:#999; margin-top:4px;">※全角カタカナで入力してください（スペース含めて20文字以内）</p>
      </div>

      <!-- Submit area -->
      <div class="submit-area">
        <button type="button" class="btn" onclick="history.back()">戻る</button>
        <button type="submit" class="btn-black">提出して次へ（完了画面）　→</button>
      </div>

    </form>
  </div>

  <div style="text-align:center; margin-top:20px; font-size:11px; color:#aaa; padding-bottom:40px;">
    入力内容はSSL暗号化により保護され提供されます
  </div>
</div>

<script>
  function handleSubmit(e) {
    e.preventDefault();
    location.href = 'AP1-10.html';
  }
</script>
</body>
</html>
