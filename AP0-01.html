<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>ログイン | MooM パートナーポータル</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; border-radius: 0 !important; }
    body { font-family: 'Noto Sans JP', sans-serif; background: #f3f4f6; color: #000; font-size: 13px; margin: 0; }

    .login-card { background: #fff; border: 1px solid #000; max-width: 420px; width: 100%; margin: 0 auto; padding: 44px 40px; }

    label { display: block; font-size: 11px; font-weight: 700; color: #555; margin-bottom: 6px; }
    input[type=email], input[type=password] {
      width: 100%; border: 1px solid #000; padding: 10px 12px; font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif; outline: none; background: #fff;
      margin-bottom: 16px;
    }
    input[type=email]:focus, input[type=password]:focus { background: #fafafa; }

    .btn-black { background: #000; color: #fff; border: 1px solid #000; padding: 12px; font-size: 14px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; width: 100%; display: block; text-align: center; }
    .btn-black:hover { background: #333; }

    .pw-wrap { position: relative; }
    .pw-wrap input { margin-bottom: 0; padding-right: 40px; }
    .pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #999; font-size: 14px; background: none; border: none; padding: 0; }
    .pw-toggle:hover { color: #000; }

    .role-tab-bar { display: flex; border: 1px solid #000; margin-bottom: 28px; }
    .role-tab { flex: 1; padding: 9px 8px; text-align: center; font-size: 12px; font-weight: 700; cursor: pointer; color: #888; background: #f5f5f5; border: none; font-family: 'Noto Sans JP', sans-serif; }
    .role-tab.active { background: #000; color: #fff; }
    .role-tab:not(.active):hover { background: #eee; }

    .divider { border-top: 1px solid #e5e7eb; margin: 24px 0; }

    .error-msg { border: 1px solid #dc2626; background: #fef2f2; padding: 10px 14px; font-size: 12px; color: #dc2626; margin-bottom: 16px; display: none; align-items: center; gap: 8px; }
    .error-msg.show { display: flex; }

    .toast { position: fixed; bottom: 24px; right: 24px; border: 1px solid #000; background: #fff; padding: 12px 20px; font-size: 13px; z-index: 9999; display: none; align-items: center; gap: 10px; }
    .toast.show { display: flex; }
  </style>
</head>
<body>
<div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 16px;">

  <!-- Logo -->
  <div style="text-align:center; margin-bottom:32px;">
    <div style="font-size:22px; font-weight:700; letter-spacing:1px;">MooM</div>
    <div style="font-size:11px; color:#888; margin-top:4px;">パートナーポータル</div>
  </div>

  <div class="login-card">

    <h1 style="font-size:16px; font-weight:700; margin:0 0 22px 0; text-align:center;">パートナーログイン</h1>

    <!-- Role tab -->
    <div class="role-tab-bar" id="roleTabs">
      <button class="role-tab active" onclick="setRole('camera', this)">
        <i class="fas fa-camera" style="margin-right:5px;"></i>カメラマン
      </button>
      <button class="role-tab" onclick="setRole('nairan', this)">
        <i class="fas fa-home" style="margin-right:5px;"></i>内覧パートナー
      </button>
      <button class="role-tab" onclick="setRole('agency', this)">
        <i class="fas fa-file-signature" style="margin-right:5px;"></i>契約パートナー
      </button>
    </div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg">
      <i class="fas fa-exclamation-circle"></i>
      <span id="errorText">メールアドレスまたはパスワードが正しくありません</span>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">

      <div>
        <label for="email">メールアドレス</label>
        <input type="email" id="email" placeholder="example@domain.com" required autocomplete="email"/>
      </div>

      <div>
        <label for="password">パスワード</label>
        <div class="pw-wrap" style="margin-bottom:6px;">
          <input type="password" id="password" placeholder="パスワードを入力" required autocomplete="current-password"/>
          <button type="button" class="pw-toggle" onclick="togglePw()" id="pwToggleBtn">
            <i class="fas fa-eye" id="pwEyeIcon"></i>
          </button>
        </div>
      </div>

      <div style="text-align:right; margin-bottom:20px;">
        <a href="#" style="font-size:11px; color:#666; text-decoration:underline;" onclick="showForgotPw()">
          パスワードをお忘れの方
        </a>
      </div>

      <button type="submit" class="btn-black" id="loginBtn">
        ログイン
      </button>

    </form>

    <div class="divider"></div>

    <div style="text-align:center;">
      <p style="font-size:11px; color:#aaa; margin:0;">
        アカウントをお持ちでない方は<br>
        MooM運営からの招待メールよりご登録ください
      </p>
    </div>

  </div>

  <!-- Forgot password modal backdrop -->
  <div id="forgotModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:900; align-items:center; justify-content:center;">
    <div style="background:#fff; border:1px solid #000; padding:28px 32px; width:380px; max-width:95%; position:relative;">
      <button onclick="closeForgotPw()" style="position:absolute; top:14px; right:14px; border:none; background:none; font-size:16px; cursor:pointer; color:#666;"><i class="fas fa-times"></i></button>
      <div style="font-size:15px; font-weight:700; margin-bottom:10px;">パスワードの再設定</div>
      <p style="font-size:12px; color:#555; margin-bottom:18px; line-height:1.7;">登録済みのメールアドレスを入力してください。パスワードリセット用のリンクをお送りします。</p>
      <label style="font-size:11px; font-weight:700; color:#555; display:block; margin-bottom:6px;">メールアドレス</label>
      <input type="email" id="forgotEmail" placeholder="example@domain.com" style="width:100%; border:1px solid #000; padding:9px 12px; font-size:13px; outline:none; margin-bottom:20px; font-family:'Noto Sans JP',sans-serif;"/>
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button onclick="closeForgotPw()" style="border:1px solid #000; padding:8px 20px; background:#fff; font-size:13px; cursor:pointer; font-family:'Noto Sans JP',sans-serif;">キャンセル</button>
        <button onclick="sendReset()" style="background:#000; color:#fff; border:1px solid #000; padding:8px 20px; font-size:13px; cursor:pointer; font-family:'Noto Sans JP',sans-serif; font-weight:700;">送信する</button>
      </div>
    </div>
  </div>

  <div style="text-align:center; margin-top:20px; font-size:11px; color:#aaa; padding-bottom:20px;">
    © MooM パートナーポータル
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <i class="fas fa-check-circle" style="color:#16a34a;"></i>
  <span id="toastMsg"></span>
</div>

<script>
  let currentRole = 'camera';

  function setRole(role, el) {
    currentRole = role;
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('errorMsg').classList.remove('show');
  }

  function togglePw() {
    const input = document.getElementById('password');
    const icon = document.getElementById('pwEyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'fas fa-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'fas fa-eye';
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.textContent = 'ログイン中...';
    btn.disabled = true;

    // Simulate login → redirect to dashboard
    setTimeout(() => {
      location.href = 'CM0-01.html';
    }, 1000);
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    document.getElementById('errorText').textContent = msg || 'メールアドレスまたはパスワードが正しくありません';
    el.classList.add('show');
  }

  function showForgotPw() {
    document.getElementById('forgotModal').style.display = 'flex';
  }

  function closeForgotPw() {
    document.getElementById('forgotModal').style.display = 'none';
  }

  function sendReset() {
    const email = document.getElementById('forgotEmail').value;
    if (!email) return;
    closeForgotPw();
    showToast('パスワードリセットのメールを送信しました');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  document.getElementById('forgotModal').addEventListener('click', function(e) {
    if (e.target === this) closeForgotPw();
  });
</script>
</body>
</html>
