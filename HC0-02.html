<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お問い合わせ - MooM カメラマン</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "wireframe-bg": "#ffffff",
              "wireframe-border": "#333333",
              "wireframe-box": "#f3f4f6",
            },
            fontFamily: { "sans": ["Noto Sans JP", "sans-serif"] },
          },
        },
      }
    </script>
    <style type="text/tailwindcss">
      @layer base { body { @apply bg-wireframe-bg text-black font-sans; } }
      .wireframe-box  { @apply border border-wireframe-border bg-white; }
      .wireframe-label { @apply block text-xs font-bold mb-2; }
      .wireframe-input { @apply w-full border border-black p-3 text-sm outline-none focus:bg-gray-50 rounded-none; }
      .wireframe-btn   { @apply border border-black px-8 py-3 bg-white text-xs font-bold hover:bg-gray-100 rounded-none transition-all; }
      .wireframe-btn-dark { @apply border border-black px-12 py-3 bg-black text-white text-xs font-bold hover:bg-gray-800 rounded-none transition-all; }
    </style>
</head>
<body class="antialiased">

<div class="flex h-screen w-full overflow-hidden relative">

    <!-- SIDEBAR -->
    <aside class="w-64 border-r border-black flex flex-col bg-white shrink-0">
        <div class="p-6 border-b border-black">
            <h1 class="text-lg font-bold leading-tight">MooM<br />カメラマンポータル</h1>
        </div>
        <nav class="flex-1 py-4">
            <ul class="space-y-1">
                <li><a class="block px-6 py-3 text-sm hover:bg-gray-100" href="CM0-01.html">ダッシュボード</a></li>
                <li><a class="block px-6 py-3 text-sm hover:bg-gray-100" href="CM2-01.html">物件一覧</a></li>
                <li><a class="block px-6 py-3 text-sm hover:bg-gray-100" href="CM07.html">撮影案件</a></li>
                <li><a class="block px-6 py-3 text-sm hover:bg-gray-100" href="CM4-01.html">カレンダー</a></li>
                <li><a class="block px-6 py-3 text-sm hover:bg-gray-100" href="PC2-01.html">報酬管理</a></li>
                <li><a class="block px-6 py-3 text-sm hover:bg-gray-100" href="AD24.html">設定</a></li>
            </ul>
        </nav>
        <div class="p-4 border-t border-black">
            <div class="border border-black p-2 text-center text-xs font-bold bg-white">佐藤 健太</div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto bg-white">
        
        <!-- Header -->
        <header style="height:52px; border-bottom:1px solid #000; display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:#fff; position:sticky; top:0; z-index:200; flex-shrink:0;">
          <div style="flex:1; max-width:360px;">
            <input type="text" placeholder="グローバル検索..." style="width:100%; border:1px solid #000; padding:5px 10px; font-size:12px; font-family:inherit; outline:none; background:#fff;">
          </div>
          <div style="display:flex; gap:14px; align-items:center;">
            <a href="HC0-01.html" class="w-7 h-7 flex items-center justify-center border border-black bg-black text-white text-sm font-bold shadow-[2px_2px_0px_#000]">?</a>
            <button style="border:1px solid #000; padding:4px 12px; font-size:12px; font-weight:700; background:#fff; cursor:pointer;">
                佐藤 健太 <span style="font-size:10px; color:#888;">▾</span>
            </button>
          </div>
        </header>

        <div class="p-8 max-w-3xl mx-auto w-full space-y-8">
            <nav class="text-[10px] text-gray-500">
                <a href="HC0-01.html" class="hover:underline">ヘルプセンター</a> &gt; おお問い合わせ
            </nav>

            <h2 class="text-2xl font-bold uppercase tracking-tight">Contact Support</h2>

            <div class="wireframe-box p-8 space-y-8">
                <p class="text-xs text-gray-600 leading-relaxed border-b border-gray-100 pb-6">
                    カメラマン向けのサポート窓口です。撮影中のトラブル、データのアップロード、報酬の支払いに関するお問い合わせはこちらからお願いします。
                </p>

                <form class="space-y-6">
                    <div class="space-y-1">
                        <label class="wireframe-label">お問い合わせカテゴリ <span class="text-red-500">*</span></label>
                        <select class="wireframe-input">
                            <option value="">選択してください</option>
                            <option value="upload">データのアップロード・再提出について</option>
                            <option value="trouble">現地撮影中のトラブル（入室できない等）</option>
                            <option value="reward">報酬・振込口座について</option>
                            <option value="system">システム操作・不具合について</option>
                            <option value="other">その他</option>
                        </select>
                    </div>

                    <div class="space-y-1">
                        <label class="wireframe-label">件名 <span class="text-red-500">*</span></label>
                        <input type="text" class="wireframe-input" placeholder="例：撮影データのアップロードが中断される" />
                    </div>

                    <div class="space-y-1">
                        <label class="wireframe-label">お問い合わせ内容 <span class="text-red-500">*</span></label>
                        <textarea class="wireframe-input h-40" placeholder="具体的な状況（発生日時、物件名、エラーメッセージ等）をご記入ください"></textarea>
                    </div>

                    <div class="space-y-1">
                        <label class="wireframe-label text-gray-700">案件ID / 物件名 <span class="text-[10px] font-normal text-gray-400">（任意）</span></label>
                        <input type="text" class="wireframe-input" placeholder="例：SHT-021 / 恵比寿レジデンス" />
                    </div>

                    <div class="space-y-1">
                        <label class="wireframe-label">添付ファイル（スクリーンショット等）</label>
                        <div class="border-2 border-dashed border-black p-10 text-center bg-gray-50 cursor-pointer hover:bg-gray-100 transition-colors">
                            <span class="text-lg block mb-2">📁</span>
                            <p class="text-[10px] uppercase font-bold tracking-widest text-gray-500">Drop files here or click to upload</p>
                        </div>
                    </div>

                    <div class="pt-6 border-t border-black flex justify-center gap-4">
                        <button type="button" onclick="location.href='HC0-01.html'" class="wireframe-btn">キャンセル</button>
                        <button type="submit" class="wireframe-btn-dark uppercase">Send Support Request</button>
                    </div>
                </form>
            </div>
            
            <div class="text-center">
                <p class="text-[10px] text-gray-400 font-mono tracking-tighter uppercase">Support Portal v1.0 / Privacy Policy</p>
            </div>
        </div>
    </main>
</div>

</body>
</html>
